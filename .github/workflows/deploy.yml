name: Build & Deploy Solveryn

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  RUST_TOOLCHAIN: stable
  SOLANA_VERSION: v1.18.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install Solana CLI
      run: |
        sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        solana --version
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Anchor
      run: |
        cargo install avm-cli --locked
        avm install 0.30.1
        avm use 0.30.1
        anchor --version
    
    - name: Setup Solana Config
      run: |
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        mkdir -p ~/.config/solana
        solana config set --url devnet
    
    - name: Generate Keypair
      run: |
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        solana-keygen new --no-bip39-passphrase -s ~/.config/solana/id.json --force
    
    - name: Request Devnet SOL Airdrop
      run: |
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        solana airdrop 2 --commitment confirmed
      continue-on-error: true
    
    - name: Install Dependencies
      run: npm install
    
    - name: Build Anchor Program
      run: |
        export PATH="/home/runner/.cargo/bin:$PATH"
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        anchor build
    
    - name: Run Tests
      run: |
        export PATH="/home/runner/.cargo/bin:$PATH"
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        npm test
      continue-on-error: true
    
    - name: Deploy to Devnet
      run: |
        export PATH="/home/runner/.cargo/bin:$PATH"
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        anchor deploy --provider.cluster devnet
      env:
        ANCHOR_WALLET: ~/.config/solana/id.json
    
    - name: Output Deployment Info
      run: |
        echo "✅ Solveryn deployed to devnet!"
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        solana address
      continue-on-error: true
