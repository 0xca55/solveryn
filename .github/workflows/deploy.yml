name: Build & Deploy Solveryn

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  RUST_TOOLCHAIN: stable
  SOLANA_VERSION: v1.18.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install Solana CLI
      run: |
        sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        solana --version
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Anchor
      run: |
        npm install -g @coral-xyz/anchor-cli@0.30.1
        anchor --version
    
    - name: Setup Solana Config
      run: |
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        mkdir -p ~/.config/solana
        solana config set --url devnet
    
    - name: Generate Keypair
      run: |
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json --force
    
    - name: Request Devnet SOL Airdrop
      run: |
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        solana airdrop 2 --commitment confirmed
      continue-on-error: true
    
    - name: Install Dependencies
      run: npm install --legacy-peer-deps
    
    - name: Build Anchor Program
      run: |
        export PATH="/home/runner/.cargo/bin:$PATH"
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        anchor build
    
    - name: Run Tests
      run: |
        export PATH="/home/runner/.cargo/bin:$PATH"
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        npm test
      continue-on-error: true
    
    - name: Deploy to Devnet
      run: |
        export PATH="/home/runner/.cargo/bin:$PATH"
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        anchor deploy --provider.cluster devnet
      env:
        ANCHOR_WALLET: ~/.config/solana/id.json
    
    - name: Capture Deployment Info
      run: |
        export PATH="/home/runner/.cargo/bin:$PATH"
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        
        # Get fee payer wallet address
        WALLET_ADDRESS=$(solana address)
        echo "Fee Payer Wallet: $WALLET_ADDRESS"
        
        # Get program ID using solana-keygen pubkey command
        PROGRAM_KEYPAIR="target/deploy/solveryn-keypair.json"
        if [ -f "$PROGRAM_KEYPAIR" ]; then
          PROGRAM_ID=$(solana-keygen pubkey "$PROGRAM_KEYPAIR")
          echo "Program ID: $PROGRAM_ID"
        else
          PROGRAM_ID="KEYPAIR_NOT_FOUND"
          echo "ERROR: Keypair not found at $PROGRAM_KEYPAIR"
        fi
        
        # Save deployment info to file
        cat > .devnet.json << EOF
{
  "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
  "feePayerWallet": "$WALLET_ADDRESS",
  "programId": "$PROGRAM_ID",
  "cluster": "devnet",
  "notes": "Each CI/CD run generates a fresh wallet and program keypair. This captures the addresses for testing."
}
EOF
        
        echo "=== Deployment Info ==="
        cat .devnet.json
      continue-on-error: true
    
    - name: Commit & Push Deployment Info
      run: |
        git config user.email "cass@yatori.io"
        git config user.name "Cass"
        git add .devnet.json
        git commit -m "chore: capture devnet deployment info (wallet + program ID)" || echo "No changes to commit"
        git push origin main || echo "Push failed (may be expected)"
      continue-on-error: true
